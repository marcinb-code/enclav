<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 78" fill="none" role="img" aria-labelledby="title">
  <title id="title">ENCLAV mark</title>
  <defs>
    <linearGradient id="silverTop" x1="12" y1="8" x2="60" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".48" stop-color="#eef2f4"/>
      <stop offset="1" stop-color="#aeb7bd"/>
    </linearGradient>
    <linearGradient id="silverSide" x1="7" y1="25" x2="37" y2="67" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4f6f7"/>
      <stop offset=".52" stop-color="#aab3b9"/>
      <stop offset="1" stop-color="#e6eaec"/>
    </linearGradient>
    <linearGradient id="greenTop" x1="37" y1="48" x2="69" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69ffd0"/>
      <stop offset=".45" stop-color="#37e9a7"/>
      <stop offset="1" stop-color="#12845c"/>
    </linearGradient>
    <linearGradient id="greenLower" x1="37" y1="68" x2="67" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#59ffc2"/>
      <stop offset=".42" stop-color="#35d994"/>
      <stop offset="1" stop-color="#11694d"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-35%" width="180%" height="175%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.10 0 0 0 0 0.95 0 0 0 0 0.52 0 0 0 .58 0" result="emerald"/>
      <feMerge><feMergeNode in="emerald"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke-linejoin="round">
    <!-- folded silver crown and left return -->
    <path d="M36 4 68 22 56 29 36 17 15 29 15 51 36 63 36 76 4 58 4 23 36 4Z" fill="url(#silverSide)" stroke="#d8e0e3" stroke-width="1.1"/>
    <path d="M36 4 68 22 56 29 36 17Z" fill="url(#silverTop)" stroke="#fff" stroke-width="1"/>
    <path d="M4 23 15 29 15 51 4 58Z" fill="#c5cdd1" stroke="#edf2f4" stroke-width="1"/>
    <path d="M15 51 36 63 36 76 4 58Z" fill="url(#silverSide)" stroke="#dce3e6" stroke-width="1"/>
    <!-- two emerald ribbon ends form the open right side of the mark -->
    <path d="m36 43 20-12 12-7v15L36 57V43Z" fill="url(#greenTop)" stroke="#74ffd1" stroke-width="1.1"/>
    <path d="m36 63 20-12 12-7v15L36 76V63Z" fill="url(#greenLower)" stroke="#5af8ba" stroke-width="1.1"/>
    <!-- shaded inner folds -->
    <path d="m36 17 20 12v4L36 45V33l10-6-10-6Z" fill="#07130f" opacity=".92"/>
    <path d="m36 57 20-12 12 7-32 19V57Z" fill="#07130f" opacity=".2"/>
  </g>
</svg>
